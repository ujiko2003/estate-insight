services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  postgres:
    image: postgis/postgis:16-3.4
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: estate
      POSTGRES_USER: estate
      POSTGRES_PASSWORD: estate
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "estate"]
      interval: 10s
      timeout: 5s
      retries: 5