server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estate}
    username: ${DB_USER:estate}
    password: ${DB_PASSWORD:estate}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health
